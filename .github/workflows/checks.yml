name: Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Domain and comparison tests
        run: npm test
      - name: SQLite integration and browser acceptance
        run: |
          export NORTHLINE_COORDINATOR_KEY="$(openssl rand -hex 32)"
          export NORTHLINE_REVIEWER_KEY="$(openssl rand -hex 32)"
          export NORTHLINE_CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$NORTHLINE_CHROME_BIN"
          npm start > /tmp/northline.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4317/api/health > /dev/null
          node --experimental-strip-types integration.ts
          node tests/browser-smoke.mjs
      - name: Attach real browser screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: northline-atelier-browser
          path: artifacts/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
