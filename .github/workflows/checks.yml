name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Domain tests
        run: npm test
      - name: Start demo and exercise API
        run: |
          export NORTHLINE_COORDINATOR_KEY="$(openssl rand -hex 32)"
          export NORTHLINE_REVIEWER_KEY="$(openssl rand -hex 32)"
          npm start > /tmp/northline.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/api/health > /dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types integration.ts
